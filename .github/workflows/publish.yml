name: Publish release

# An annotated v* tag supplies the version and GitHub release notes.
# Preserve Markdown headings with --cleanup=verbatim and push only this tag:
# `git tag -a --cleanup=verbatim vX.Y.Z -F release-notes.txt && git push origin vX.Y.Z`.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs full git history to compute the version
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Package the bundled extension and artifact checksums
        run: python scripts/build_release_assets.py --dist dist --output release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Environment is required by the PyPI trusted publisher config —
    # mirror the environment name on PyPI's "pending publisher" page.
    environment:
      name: release
      url: https://pypi.org/project/ai-dev-browser/
    permissions:
      # Required for PyPI OIDC trusted publisher auth — no token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/
      - name: Publish tagged release and matching artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout can replace an annotated tag with its peeled commit when
          # comparing it with github.sha. Restore the remote tag object so gh
          # reads the release notes, rather than just the commit's subject.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          gh release create "$GITHUB_REF_NAME" dist/* release-assets/* --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
