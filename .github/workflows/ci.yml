name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Loaded GitHub runners (esp. Windows: Defender scan + first-run profile
      # init + I/O contention) occasionally need >30s for Chrome to bind its
      # debug port — a slow cold-start, not a real failure. Give browser_start
      # generous headroom so it isn't a false red on retry. Real users keep the
      # 30s default; this only widens it on the known-slow CI host.
      AI_DEV_BROWSER_STARTUP_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: uv sync --extra dev --extra remote

      # ── Tool dispatch smoke test ──
      # Verifies python -m entry point works on all platforms.
      - name: Test tool dispatch
        run: |
          uv run python -m ai_dev_browser.tools.browser_start --help

      # ── Headless browser smoke test ──
      # shell: bash so the heredoc-style `python -c "..."` block parses
      # identically on all three runners (PowerShell on Windows handles
      # backslash-escaped quotes differently from POSIX shells, which
      # silently broke this step on windows-latest pre-v0.11.2).
      - name: Smoke test headless browser
        shell: bash
        run: |
          uv run python -c "
          from ai_dev_browser.core.browser import browser_start, browser_stop

          result = browser_start(headless=True, temp=True)
          if 'error' in result:
              print('SKIP:', result['error'])
              exit(0)

          port = result['port']
          pid = result['pid']
          print(f'Started: port={port}, pid={pid}, reused={result.get(\"reused\", False)}')

          stop_result = browser_stop(port=port)
          print(f'Stopped: {stop_result}')
          print('Smoke test passed.')
          "

      - name: Real CLI browser session lifecycle
        run: uv run python -m pytest -v tests/integration/test_browser_lifecycle.py --basetemp lifecycle-results

      # ── E2E regression suite ──
      # Tests in `tests/integration/` that are self-contained (no real
      # logged-in browser, no external state) — they fabricate inputs,
      # exercise production code, and assert on outputs. New regression
      # tests get appended here; tests that depend on user-specific
      # state (`test_cookies_import.py`, much of `test_locator_workflows`)
      # stay out — they're meaningful only on a dev box with real
      # browser sessions, not on a clean GitHub runner.
      #
      # test_cookies_extract_windows.py is windows-only by design; it
      # auto-skips on ubuntu / macos. test_cli_unicode_help.py is
      # cross-platform but most-valuable on Windows (where cp1252 is
      # the default codec that broke browser_start --help in v0.10.2).
      - name: E2E regression tests
        shell: bash
        run: |
          uv run python -m pytest -v --basetemp test-results \
            tests/unit/ \
            tests/integration/test_ci_integration.py \
            tests/integration/test_config_resolvers.py \
            tests/integration/test_pool_model_persistence.py \
            tests/integration/test_browser_start_retry.py \
            tests/integration/test_browser_inventory.py \
            tests/integration/test_proxy_identity.py \
            tests/integration/test_stealth_defaults.py \
            tests/integration/test_ext_bridge.py \
            tests/integration/test_background_processes.py \
            tests/integration/test_cookies_extract_hermetic.py \
            tests/integration/test_cookies_extract_live.py \
            tests/integration/test_cookies_extract_windows.py \
            tests/integration/test_cli_unicode_help.py \
            tests/integration/test_cli_extension_workflows.py \
            tests/integration/test_recording_workflows.py \
            tests/integration/test_recording_demo.py \
            tests/integration/test_image_cap.py \
            tests/integration/test_scroll_embedded_target.py \
            tests/integration/test_press_key.py \
            tests/integration/test_type_verified_fill.py \
            tests/integration/test_click_robust.py \
            tests/integration/test_page_discover.py \
            tests/integration/test_dom_discovery.py \
            tests/integration/test_page_goto.py \
            tests/integration/test_page_pdf.py \
            tests/integration/test_pdf_readiness.py \
            tests/integration/test_cdp_send_warning.py \
            tests/integration/test_download_link_frame.py \
            tests/integration/test_page_scroll_verify.py \
            tests/integration/test_tab_close.py \
            tests/integration/test_mouse_drag_move.py \
            tests/integration/test_page_wait_element.py

      - name: Retain recording demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-demo-${{ matrix.os }}
          retention-days: 7
          path: |
            test-results/**/demo.gif
            test-results/**/plain.gif
            test-results/**/scoped.gif
            test-results/**/demo-frame-*.png
            test-results/**/*-evidence.json
            test-results/**/extension-lifecycle.png
            test-results/**/installed-extension.png
            test-results/**/card.pdf
            lifecycle-results/**/*-evidence.json
            lifecycle-results/**/live-cli.json
            lifecycle-results/**/extension-lifecycle.png
            lifecycle-results/**/installed-extension.png

  remote-view-live:
    name: Remote browser view (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AI_DEV_BROWSER_STARTUP_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: python -m pip install ".[dev,remote]"
      - name: Install the real X11 and noVNC viewer
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth x11vnc novnc websockify
      - name: Run page, extension and full-window workflows on Linux
        if: runner.os == 'Linux'
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python -m pytest -v tests/integration/test_remote_view.py tests/integration/test_remote_vnc.py tests/integration/test_browser_control_live.py tests/integration/test_browser_session_live.py tests/integration/test_browser_files_live.py tests/integration/test_browser_worker_live.py --basetemp remote-results
      - name: Run page and extension workflows on Windows
        if: runner.os == 'Windows'
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python -m pytest -v tests/integration/test_remote_view.py tests/integration/test_browser_control_live.py tests/integration/test_browser_session_live.py tests/integration/test_browser_files_live.py tests/integration/test_browser_worker_live.py --basetemp remote-results
      - name: Retain real viewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-view-${{ matrix.os }}
          path: remote-results/**
          retention-days: 7

  managed-extension-live:
    name: Managed branded Chrome (headless extension)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create an isolated fixture signing key
        run: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/extension-fixture.pem"
      - name: Build the shared managed Chrome runtime
        run: docker build -f deploy/managed-chrome/Dockerfile --secret "id=extension_key,src=$RUNNER_TEMP/extension-fixture.pem" --build-arg "SOURCE_REVISION=$GITHUB_SHA" -t adb-managed-chrome:ci .
      - name: Run real signed extension, handoff and viewer workflows
        run: |
          docker create --name "adb-managed-live-$GITHUB_RUN_ID" --memory=1536m --shm-size=256m --pids-limit=384 \
            --mount "type=bind,source=$PWD/tests,target=/opt/browser/tests,readonly" \
            adb-managed-chrome:ci /bin/sleep infinity
          docker start "adb-managed-live-$GITHUB_RUN_ID"
          docker exec --user root "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/pip install pytest pytest-asyncio
          docker exec "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/python tests/integration/run_managed_extension.py
      - name: Collect actual-browser evidence
        if: always()
        run: docker cp "adb-managed-live-$GITHUB_RUN_ID:/tmp/managed-results" "$RUNNER_TEMP/managed-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-extension-evidence
          path: ${{ runner.temp }}/managed-results/**/*
          retention-days: 7
      - name: Remove the fixture signing key
        if: always()
        run: |
          docker rm -f "adb-managed-live-$GITHUB_RUN_ID" || true
          rm -f "$RUNNER_TEMP/extension-fixture.pem"

  extension-live:
    timeout-minutes: 25
    name: Real extension (${{ matrix.os }}, websockets ${{ matrix.websockets }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            websockets: "13.1"
          - os: windows-latest
            websockets: "locked"
          - os: windows-latest
            websockets: "latest"
    runs-on: ${{ matrix.os }}
    env:
      AI_DEV_BROWSER_STARTUP_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra remote
      - name: Exercise the supported legacy dependency
        if: matrix.websockets == '13.1'
        run: uv pip install "websockets==${{ matrix.websockets }}"
      - name: Exercise fresh PyPI dependency resolution
        if: matrix.websockets == 'latest'
        run: uv pip install --upgrade websockets Pillow deprecated
      # Chrome for Testing supports loading the actual bundled extension in a
      # fresh headless profile; no fake chrome.debugger or user login required.
      # v1's stable channel installs branded Chrome, which ignores --load-extension.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Run the real extension on both WebSocket server implementations
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: uv run --no-sync python -m pytest -v --full-trace -o faulthandler_timeout=180 tests/integration/test_cli_extension_workflows.py tests/integration/test_recording_workflows.py tests/integration/test_recording_demo.py tests/integration/test_browser_lifecycle.py tests/integration/test_remote_view.py tests/integration/test_extension_ownership.py -k "real_extension or outbound_proxy" --basetemp extension-results

      - name: Install native Chrome interaction tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth openbox xdotool

      - name: Honor real native debugger consent cancellation
        if: runner.os == 'Linux'
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_OWNERSHIP_NATIVE: "1"
        run: |
          # Native permission UI needs a fresh desktop for each browser session.
          mkdir -p native-ownership-results
          for backend in legacy asyncio; do
            xvfb-run -a -s "-screen 0 1280x1000x24" bash -c '
              openbox > /tmp/adb-ownership-openbox.log 2>&1 &
              uv run --no-sync python -m pytest -v "tests/integration/test_extension_ownership_native.py::test_real_extension_native_consent_revocation[$1]" --basetemp "native-ownership-results/$1"
            ' _ "$backend"
          done

      - name: Retain extension recording evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-extension-${{ matrix.os }}-${{ matrix.websockets }}
          retention-days: 7
          path: |
            extension-results/**/extension.gif
            extension-results/**/demo-frame-*.png
            extension-results/**/extension-evidence.json
            extension-results/**/*-evidence.json
            extension-results/**/extension-lifecycle.png
            extension-results/**/installed-extension.png
            extension-results/**/extension-startup-evidence.json
            extension-results/**/extension-chrome.log
            extension-results/**/extension-cleanup-stacks.txt
            native-ownership-results/**

  # ─────────────────────────────────────────────────────────────────────
  # CI-integration dogfood: prove the documented "consumer's CI" recipe
  # actually works. Mirrors what an external integrator would write:
  # setup-chrome action → AI_DEV_BROWSER_CHROME env → headless=old (new
  # mode rejects --enable-automation under some GitHub-Chrome combos) →
  # --no-sandbox (GitHub hosted runners ship chrome-sandbox without the
  # SUID bit, so the new-headless sandbox aborts).
  #
  # Regression captured: reporter dogfooding v0.9.3 had to launch Chrome
  # externally + connect via --port because none of the above was
  # supported. v0.10.0/.1/.2 added each piece; this job keeps that path
  # green on every commit.
  # ─────────────────────────────────────────────────────────────────────
  ci-integration:
    name: Dogfood the consumer CI recipe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Validate release artifacts
        run: |
          uv build
          uv run python scripts/build_release_assets.py --dist dist --output release-assets
      - name: Verify CI-style chrome launch
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          uv run python -c "
          from ai_dev_browser.core.browser import browser_start, browser_stop
          from ai_dev_browser.core.chrome import find_chrome

          # 1. find_chrome() must pick up AI_DEV_BROWSER_CHROME, NOT a
          #    system Chrome that happens to be on PATH.
          resolved = find_chrome()
          assert resolved == '${{ steps.chrome.outputs.chrome-path }}', (
              f'find_chrome resolved {resolved!r}, expected env path'
          )

          # 2. Launch headless=old + --no-sandbox (the recipe an
          #    integrator on GitHub hosted runner needs).
          result = browser_start(
              headless='old',
              temp=True,
              extra_args=['--no-sandbox'],
          )
          if 'error' in result:
              raise SystemExit(f'CI recipe failed: {result}')
          print(f'CI recipe succeeded: port={result[\"port\"]} pid={result[\"pid\"]}')
          browser_stop(port=result['port'])
          print('Dogfood complete.')
          "
