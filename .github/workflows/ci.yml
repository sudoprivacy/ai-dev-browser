name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Loaded GitHub runners (esp. Windows: Defender scan + first-run profile
      # init + I/O contention) occasionally need >30s for Chrome to bind its
      # debug port — a slow cold-start, not a real failure. Give browser_start
      # generous headroom so it isn't a false red on retry. Real users keep the
      # 30s default; this only widens it on the known-slow CI host.
      AI_DEV_BROWSER_STARTUP_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package
        run: uv sync --extra dev --extra remote

      - name: Check extension window and ownership contracts
        run: node --test tests/unit/extension_ownership.test.cjs tests/unit/page_view_input.test.cjs

      # ── Tool dispatch smoke test ──
      # Verifies python -m entry point works on all platforms.
      - name: Test tool dispatch
        run: |
          uv run python -m ai_dev_browser.tools.browser_start --help

      # ── Headless browser smoke test ──
      # shell: bash so the heredoc-style `python -c "..."` block parses
      # identically on all three runners (PowerShell on Windows handles
      # backslash-escaped quotes differently from POSIX shells, which
      # silently broke this step on windows-latest pre-v0.11.2).
      - name: Smoke test headless browser
        shell: bash
        run: |
          uv run python -c "
          from ai_dev_browser.core.browser import browser_start, browser_stop

          result = browser_start(headless=True, temp=True)
          if 'error' in result:
              print('SKIP:', result['error'])
              exit(0)

          port = result['port']
          pid = result['pid']
          print(f'Started: port={port}, pid={pid}, reused={result.get(\"reused\", False)}')

          stop_result = browser_stop(port=port)
          print(f'Stopped: {stop_result}')
          print('Smoke test passed.')
          "

      - name: Real CLI browser session lifecycle
        run: uv run python -m pytest -v tests/integration/test_browser_lifecycle.py tests/integration/test_cli_steering.py --basetemp lifecycle-results

      # ── E2E regression suite ──
      # Tests in `tests/integration/` that are self-contained (no real
      # logged-in browser, no external state) — they fabricate inputs,
      # exercise production code, and assert on outputs. New regression
      # tests get appended here; tests that depend on user-specific
      # state (`test_cookies_import.py`, much of `test_locator_workflows`)
      # stay out — they're meaningful only on a dev box with real
      # browser sessions, not on a clean GitHub runner.
      #
      # test_cookies_extract_windows.py is windows-only by design; it
      # auto-skips on ubuntu / macos. test_cli_unicode_help.py is
      # cross-platform but most-valuable on Windows (where cp1252 is
      # the default codec that broke browser_start --help in v0.10.2).
      - name: E2E regression tests
        shell: bash
        run: |
          uv run python -m pytest -v --basetemp test-results \
            tests/unit/ \
            tests/integration/test_ci_integration.py \
            tests/integration/test_config_resolvers.py \
            tests/integration/test_pool_model_persistence.py \
            tests/integration/test_browser_start_retry.py \
            tests/integration/test_browser_inventory.py \
            tests/integration/test_proxy_identity.py \
            tests/integration/test_stealth_defaults.py \
            tests/integration/test_ext_bridge.py \
            tests/integration/test_background_processes.py \
            tests/integration/test_cookies_extract_hermetic.py \
            tests/integration/test_cookies_extract_live.py \
            tests/integration/test_cookies_extract_windows.py \
            tests/integration/test_cli_unicode_help.py \
            tests/integration/test_cli_extension_workflows.py \
            tests/integration/test_recording_workflows.py \
            tests/integration/test_recording_demo.py \
            tests/integration/test_image_cap.py \
            tests/integration/test_scroll_embedded_target.py \
            tests/integration/test_press_key.py \
            tests/integration/test_type_verified_fill.py \
            tests/integration/test_editor_click.py \
            tests/integration/test_click_robust.py \
            tests/integration/test_page_discover.py \
            tests/integration/test_dom_discovery.py \
            tests/integration/test_page_goto.py \
            tests/integration/test_page_pdf.py \
            tests/integration/test_pdf_readiness.py \
            tests/integration/test_cdp_send_warning.py \
            tests/integration/test_download_link_frame.py \
            tests/integration/test_page_scroll_verify.py \
            tests/integration/test_tab_close.py \
            tests/integration/test_mouse_drag_move.py \
            tests/integration/test_page_wait_element.py

      - name: Retain recording demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-demo-${{ matrix.os }}
          retention-days: 7
          path: |
            test-results/**/demo.gif
            test-results/**/plain.gif
            test-results/**/scoped.gif
            test-results/**/demo-frame-*.png
            test-results/**/*-evidence.json
            test-results/**/extension-lifecycle.png
            test-results/**/installed-extension.png
            test-results/**/card.pdf
            test-results/**/editor-accepted.png
            test-results/**/navigation-accepted.png
            test-results/**/nested-click-accepted.png
            test-results/**/editor-evidence.json
            test-results/**/navigation-evidence.json
            test-results/**/rejected-editor-evidence.json
            lifecycle-results/**/*-evidence.json
            lifecycle-results/**/live-cli.json
            lifecycle-results/**/extension-lifecycle.png
            lifecycle-results/**/installed-extension.png

  remote-view-live:
    timeout-minutes: 25
    name: Remote browser view (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AI_DEV_BROWSER_STARTUP_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Stage Chrome for the Windows sandbox
        if: runner.os == 'Windows'
        id: windows-chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:PUBLIC "ai-dev-browser-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $browser = & ./scripts/prepare-windows-chrome.ps1 -ChromePath '${{ steps.chrome.outputs.chrome-path }}' -DestinationDirectory $fixture -ReceiptPath "$env:RUNNER_TEMP/windows-chrome-staging.json"
          "chrome-path=$browser" >> $env:GITHUB_OUTPUT
      - run: python -m pip install ".[dev,remote]"
      - name: Install the real X11 and noVNC viewer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb xauth x11-utils x11vnc novnc websockify openbox xdotool xclip
          command -v Xvfb openbox xprop xdotool xclip
      - name: Run page, extension and full-window workflows on Linux
        if: runner.os == 'Linux'
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          xvfb-run -a -s "-screen 0 1280x1000x24" bash -euo pipefail -c '
            openbox --sm-disable > /tmp/adb-remote-openbox.log 2>&1 &
            manager=$!
            trap "kill $manager 2>/dev/null || true" EXIT
            for attempt in $(seq 1 50); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            python -m pytest -v --full-trace -o faulthandler_timeout=180 tests/integration/test_worker_frames_live.py tests/integration/test_extension_frames_live.py tests/integration/test_remote_view.py tests/integration/test_worker_page_drag_live.py tests/integration/test_discovery_socket_pressure.py tests/integration/test_remote_selection_live.py tests/integration/test_remote_vnc.py tests/integration/test_worker_window_stream_live.py tests/integration/test_browser_control_live.py tests/integration/test_browser_session_live.py tests/integration/test_browser_files_live.py tests/integration/test_browser_worker_live.py tests/integration/test_existing_worker_live.py tests/integration/test_navigation_startup.py --basetemp remote-results
          '
      - name: Run page and extension workflows on Windows
        if: runner.os == 'Windows'
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.windows-chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.windows-chrome.outputs.chrome-path }}
        run: python -m pytest -v --full-trace -o faulthandler_timeout=180 tests/integration/test_worker_frames_live.py tests/integration/test_extension_frames_live.py tests/integration/test_remote_view.py tests/integration/test_worker_page_drag_live.py tests/integration/test_discovery_socket_pressure.py tests/integration/test_remote_selection_live.py tests/integration/test_browser_control_live.py tests/integration/test_browser_session_live.py tests/integration/test_browser_files_live.py tests/integration/test_browser_worker_live.py tests/integration/test_existing_worker_live.py tests/integration/test_navigation_startup.py --basetemp remote-results
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "22"
      - name: Install the real native host fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/adb-native-host" --no-package-lock --no-audit --no-fund electron@40.8.5
      - name: Reveal owned CDP and existing extension windows from a real host click
        if: runner.os == 'Windows'
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.windows-chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.windows-chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_ELECTRON: ${{ runner.temp }}/adb-native-host/node_modules/electron/dist/electron.exe
        run: python -m pytest -v --full-trace tests/integration/test_native_window_electron_live.py --basetemp native-host-results
      - name: Check Windows sandbox startup diagnostics
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-chrome-logs.ps1 -ResultsDirectory remote-results
      - name: Retain real viewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-view-${{ matrix.os }}
          path: |
            remote-results/**
            native-host-results/**
            ${{ runner.temp }}/windows-chrome-staging.json
          retention-days: 7

  managed-extension-live:
    name: Managed branded Chrome (headless extension)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create an isolated fixture signing key
        run: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/extension-fixture.pem"
      - name: Build the shared managed Chrome runtime
        run: docker build -f deploy/managed-chrome/Dockerfile --secret "id=extension_key,src=$RUNNER_TEMP/extension-fixture.pem" --build-arg "SOURCE_REVISION=$GITHUB_SHA" -t adb-managed-chrome:ci .
      - name: Run real signed extension, handoff and viewer workflows
        run: |
          # Use the one-core profile from local real-browser acceptance.
          # Keep the established memory/PID limits and test deadlines.
          docker create --init --name "adb-managed-live-$GITHUB_RUN_ID" --cpus=1 --cpuset-cpus=0 --memory=1536m --shm-size=256m --pids-limit=384 \
            --mount "type=bind,source=$PWD/tests,target=/opt/browser/tests,readonly" \
            --mount "type=bind,source=$PWD/pyproject.toml,target=/opt/browser/pyproject.toml,readonly" \
            adb-managed-chrome:ci /bin/sleep infinity
          docker start "adb-managed-live-$GITHUB_RUN_ID"
          docker exec --user root "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/pip install pytest pytest-asyncio
          docker exec "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/python tests/integration/run_managed_extension.py
      - name: Verify read-only streaming and checked native input
        run: docker exec "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/python -m pytest -v --full-trace -o faulthandler_timeout=180 -o cache_dir=/tmp/managed-results/pytest-cache tests/integration/test_worker_window_stream_live.py tests/integration/test_worker_page_drag_live.py --basetemp /tmp/managed-results/window-stream
      - name: Verify authenticated MCP commands in real child frames
        run: docker exec "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/python -m pytest -v --full-trace -o faulthandler_timeout=180 -o cache_dir=/tmp/managed-results/pytest-cache tests/integration/test_worker_frames_live.py --basetemp /tmp/managed-results/mcp-frames
      - name: Verify host-only authorized review navigation
        run: docker exec "adb-managed-live-$GITHUB_RUN_ID" /opt/browser/venv/bin/python -m pytest -v --full-trace -o faulthandler_timeout=180 -o cache_dir=/tmp/managed-results/pytest-cache tests/integration/test_browser_worker_live.py -k host_authorized_page --basetemp /tmp/managed-results/authorized-page
      - name: Collect actual-browser evidence
        if: always()
        run: docker cp "adb-managed-live-$GITHUB_RUN_ID:/tmp/managed-results" "$RUNNER_TEMP/managed-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-extension-evidence
          path: ${{ runner.temp }}/managed-results/**/*
          retention-days: 7
      - name: Remove the fixture signing key
        if: always()
        run: |
          docker rm -f "adb-managed-live-$GITHUB_RUN_ID" || true
          rm -f "$RUNNER_TEMP/extension-fixture.pem"

  extension-live:
    timeout-minutes: 25
    name: Real extension (${{ matrix.os }}, websockets ${{ matrix.websockets }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            websockets: "13.1"
          - os: windows-latest
            websockets: "locked"
          - os: windows-latest
            websockets: "latest"
    runs-on: ${{ matrix.os }}
    env:
      AI_DEV_BROWSER_STARTUP_TIMEOUT: "90"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev --extra remote
      - name: Exercise the supported legacy dependency
        if: matrix.websockets == '13.1'
        run: uv pip install "websockets==${{ matrix.websockets }}"
      - name: Exercise fresh PyPI dependency resolution
        if: matrix.websockets == 'latest'
        run: uv pip install --upgrade websockets Pillow deprecated
      # Chrome for Testing supports loading the actual bundled extension in a
      # fresh headless profile; no fake chrome.debugger or user login required.
      # v1's stable channel installs branded Chrome, which ignores --load-extension.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Stage Chrome for the Windows sandbox
        if: runner.os == 'Windows'
        id: windows-chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:PUBLIC "ai-dev-browser-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $browser = & ./scripts/prepare-windows-chrome.ps1 -ChromePath '${{ steps.chrome.outputs.chrome-path }}' -DestinationDirectory $fixture -ReceiptPath "$env:RUNNER_TEMP/windows-chrome-staging.json"
          "chrome-path=$browser" >> $env:GITHUB_OUTPUT
      - name: Run the real extension on both WebSocket server implementations
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.windows-chrome.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
        run: uv run --no-sync python -m pytest -v --full-trace -o faulthandler_timeout=180 tests/integration/test_extension_frames_live.py tests/integration/test_cli_extension_workflows.py tests/integration/test_recording_workflows.py tests/integration/test_recording_demo.py tests/integration/test_browser_lifecycle.py tests/integration/test_remote_view.py tests/integration/test_extension_ownership.py tests/integration/test_cli_steering.py tests/integration/test_extension_windowless.py tests/integration/test_editor_click.py tests/integration/test_extension_readiness.py -k "real_extension or outbound_proxy" --basetemp extension-results

      - name: Install the unchanged released extension fixture
        run: uv pip install --target previous-extension-fixture --no-deps ai-dev-browser==0.57.7

      - name: Verify live upgrade diagnostics against the released extension
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.windows-chrome.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_PREVIOUS_EXTENSION: ${{ github.workspace }}/previous-extension-fixture/ai_dev_browser/extension
        run: uv run --no-sync python -m pytest -v tests/integration/test_extension_window_previous.py --basetemp previous-extension-results

      - name: Install the released extension without version reporting
        run: uv pip install --target unknown-extension-fixture --no-deps ai-dev-browser==0.54.0

      - name: Recover an unknown extension runtime through an ordinary reload
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.windows-chrome.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_TEST_UNKNOWN_EXTENSION: ${{ github.workspace }}/unknown-extension-fixture/ai_dev_browser/extension
        run: uv run --no-sync python -m pytest -v tests/integration/test_extension_runtime_upgrade.py --basetemp runtime-upgrade-results

      - name: Verify Windows tab activation, window focus and genuine occlusion before input
        if: runner.os == 'Windows'
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.windows-chrome.outputs.chrome-path || steps.chrome.outputs.chrome-path }}
        run: uv run --no-sync python -m pytest -v tests/integration/test_extension_window_native.py --basetemp native-window-results

      - name: Install native Chrome interaction tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb xauth x11-utils openbox xdotool

      - name: Honor real native debugger consent cancellation
        if: runner.os == 'Linux'
        env:
          AI_DEV_BROWSER_TEST_EXTENSION_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          AI_DEV_BROWSER_OWNERSHIP_NATIVE: "1"
        run: |
          # Native permission UI needs a fresh desktop for each browser session.
          mkdir -p native-ownership-results
          for backend in legacy asyncio; do
            xvfb-run -a -s "-screen 0 1280x1000x24" bash -c '
              openbox > /tmp/adb-ownership-openbox.log 2>&1 &
              uv run --no-sync python -m pytest -v "tests/integration/test_extension_ownership_native.py::test_real_extension_native_consent_revocation[$1]" --basetemp "native-ownership-results/$1"
            ' _ "$backend"
          done

      - name: Check Windows sandbox startup diagnostics
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-chrome-logs.ps1 -ResultsDirectory extension-results
      - name: Retain extension recording evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-extension-${{ matrix.os }}-${{ matrix.websockets }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/windows-chrome-staging.json
            extension-results/**/extension.gif
            extension-results/**/demo-frame-*.png
            extension-results/**/extension-evidence.json
            extension-results/**/child-frame-receipt.json
            extension-results/**/*-evidence.json
            extension-results/**/live-cli.json
            extension-results/**/extension-lifecycle.png
            extension-results/**/installed-extension.png
            extension-results/**/extension-startup-evidence.json
            extension-results/**/chrome-startup-evidence.json
            extension-results/**/windowless-startup-order.json
            extension-results/**/windowless-extension-accepted.png
            extension-results/**/extension-chrome.log
            extension-results/**/host-resources-*.json
            extension-results/**/navigation-readiness.json
            extension-results/**/extension-cleanup-stacks.txt
            native-ownership-results/**
            native-window-results/**/native-window-evidence.json
            native-window-results/**/native-window-accepted.png
            native-window-results/**/extension-chrome.log
            native-window-results/**/host-resources-*.json
            native-window-results/**/extension-cleanup-evidence.json
            native-window-results/**/extension-cleanup-stacks.txt
            previous-extension-results/**/previous-extension-evidence.json
            previous-extension-results/**/chrome-startup-evidence.json
            previous-extension-results/**/extension-*.json
            previous-extension-results/**/extension-chrome.log
            previous-extension-results/**/host-resources-*.json
            previous-extension-results/**/extension-cleanup-stacks.txt
            runtime-upgrade-results/**/runtime-upgrade-evidence.json
            runtime-upgrade-results/**/runtime-upgrade-accepted.png
            runtime-upgrade-results/**/extension-*.json
            runtime-upgrade-results/**/extension-chrome.log
            runtime-upgrade-results/**/chrome-startup-evidence.json
            runtime-upgrade-results/**/host-resources-*.json

  # ─────────────────────────────────────────────────────────────────────
  # CI-integration dogfood: prove the documented "consumer's CI" recipe
  # actually works. Mirrors what an external integrator would write:
  # setup-chrome action → AI_DEV_BROWSER_CHROME env → headless=old (new
  # mode rejects --enable-automation under some GitHub-Chrome combos) →
  # --no-sandbox (GitHub hosted runners ship chrome-sandbox without the
  # SUID bit, so the new-headless sandbox aborts).
  #
  # Regression captured: reporter dogfooding v0.9.3 had to launch Chrome
  # externally + connect via --port because none of the above was
  # supported. v0.10.0/.1/.2 added each piece; this job keeps that path
  # green on every commit.
  # ─────────────────────────────────────────────────────────────────────
  ci-integration:
    name: Dogfood the consumer CI recipe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Validate release artifacts
        run: |
          uv build
          uv run python scripts/build_release_assets.py --dist dist --output release-assets
      - name: Verify CI-style chrome launch
        env:
          AI_DEV_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          uv run python -c "
          from ai_dev_browser.core.browser import browser_start, browser_stop
          from ai_dev_browser.core.chrome import find_chrome

          # 1. find_chrome() must pick up AI_DEV_BROWSER_CHROME, NOT a
          #    system Chrome that happens to be on PATH.
          resolved = find_chrome()
          assert resolved == '${{ steps.chrome.outputs.chrome-path }}', (
              f'find_chrome resolved {resolved!r}, expected env path'
          )

          # 2. Launch headless=old + --no-sandbox (the recipe an
          #    integrator on GitHub hosted runner needs).
          result = browser_start(
              headless='old',
              temp=True,
              extra_args=['--no-sandbox'],
          )
          if 'error' in result:
              raise SystemExit(f'CI recipe failed: {result}')
          print(f'CI recipe succeeded: port={result[\"port\"]} pid={result[\"pid\"]}')
          browser_stop(port=result['port'])
          print('Dogfood complete.')
          "
